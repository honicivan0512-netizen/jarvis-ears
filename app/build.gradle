plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.jarvis.ears'
    compileSdk 34

    defaultConfig {
        applicationId "ua.jarvis.ears"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
